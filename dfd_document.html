<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BMI - Data Flow Diagrams</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 10mm;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #555;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 25px;
    }

    .page {
      width: 277mm;
      height: 190mm;
      background: #FFFFFF;
      padding: 20px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      page-break-after: always;
      page-break-inside: avoid;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
      text-align: center;
      color: #000;
    }

    .svg-container {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      max-height: 160mm;
    }

    text {
      font-family: Arial, Helvetica, sans-serif;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .node-text {
      font-size: 13px;
      font-weight: 500;
      fill: #000;
    }

    .node-text-bold {
      font-size: 14px;
      font-weight: bold;
      fill: #000;
    }

    .label-text {
      font-size: 11px;
      fill: #000;
    }

    @media print {
      body {
        background: transparent;
        padding: 0;
        gap: 0;
      }
      .page {
        box-shadow: none;
        width: 100%;
        height: 100vh;
        padding: 10mm;
      }
    }
  </style>
</head>
<body>

  <!-- ================= PAGE 1: CONTEXT DIAGRAM (LEVEL 0) ================= -->
  <div class="page">
    <div class="title">CONTEXT DIAGRAM (LEVEL 0)</div>
    <div class="svg-container">
      <svg viewBox="0 0 920 460">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000"/>
          </marker>
        </defs>

        <!-- User Entity -->
        <rect x="50" y="170" width="100" height="100" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="100" y="220" class="node-text-bold" font-size="15">User</text>

        <!-- Process 0 -->
        <rect x="350" y="125" width="200" height="190" rx="30" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="450" y="165" class="node-text-bold" font-size="16">0</text>
        <line x1="410" y1="180" x2="490" y2="180" stroke="#000" stroke-width="1.2"/>
        <text x="450" y="205" class="node-text-bold" font-size="15">BMI</text>
        <text x="450" y="235" class="node-text" font-size="14">Daily BMI</text>
        <text x="450" y="260" class="node-text" font-size="14">Application</text>

        <!-- Data Store D1 -->
        <g transform="translate(680, 135)">
          <rect x="0" y="0" width="190" height="65" fill="#FFF" stroke="#000" stroke-width="1.8"/>
          <line x1="45" y1="0" x2="45" y2="65" stroke="#000" stroke-width="1.8"/>
          <text x="22" y="32" class="node-text-bold">D1</text>
          <text x="118" y="23" class="node-text-bold" font-size="12">SharedPreferences</text>
          <text x="118" y="43" class="node-text" font-size="11">(BMI History Data)</text>
        </g>

        <!-- Data Store D2 -->
        <g transform="translate(680, 255)">
          <rect x="0" y="0" width="190" height="65" fill="#FFF" stroke="#000" stroke-width="1.8"/>
          <line x1="45" y1="0" x2="45" y2="65" stroke="#000" stroke-width="1.8"/>
          <text x="22" y="32" class="node-text-bold">D2</text>
          <text x="118" y="23" class="node-text-bold" font-size="12">SharedPreferences</text>
          <text x="118" y="43" class="node-text" font-size="11">(Login State)</text>
        </g>

        <!-- Left Arrows (User <-> Process 0) -->
        <!-- User to 0 -->
        <line x1="150" y1="190" x2="350" y2="190" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="250" y="165" class="label-text">Login Credentials,</text>
        <text x="250" y="180" class="label-text">BMI Inputs, Requests</text>

        <!-- 0 to User -->
        <line x1="350" y1="250" x2="150" y2="250" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="250" y="265" class="label-text">BMI Results, History Records,</text>
        <text x="250" y="280" class="label-text">Operation Status, Profile Info</text>

        <!-- Right Arrows (Process 0 <-> D1) -->
        <line x1="550" y1="155" x2="680" y2="155" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="615" y="140" class="label-text">Store / Update / Delete</text>
        <text x="615" y="150" class="label-text" dy="5">BMI Data</text>

        <line x1="680" y1="185" x2="550" y2="185" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="615" y="175" class="label-text">BMI Data</text>

        <!-- Right Arrows (Process 0 <-> D2) -->
        <line x1="550" y1="275" x2="680" y2="275" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="615" y="265" class="label-text">Save Login State</text>

        <line x1="680" y1="305" x2="550" y2="305" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="615" y="295" class="label-text">Login State</text>
      </svg>
    </div>
  </div>

  <!-- ================= PAGE 2: LEVEL 0 DFD (MAIN PROCESSES) ================= -->
  <div class="page">
    <div class="title">LEVEL 0 DFD (MAIN PROCESSES)</div>
    <div class="svg-container">
      <svg viewBox="0 0 940 480">
        <defs>
          <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000"/>
          </marker>
        </defs>

        <!-- User Entity -->
        <rect x="40" y="190" width="90" height="90" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="85" y="235" class="node-text-bold" font-size="15">User</text>

        <!-- Processes -->
        <!-- 1.0 -->
        <rect x="370" y="30" width="160" height="65" rx="30" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="450" y="52" class="node-text-bold">1.0</text>
        <text x="450" y="67" class="node-text">Authentication</text>
        <text x="450" y="80" class="node-text" font-size="11">Process</text>

        <!-- 2.0 -->
        <rect x="370" y="140" width="160" height="65" rx="30" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="450" y="162" class="node-text-bold">2.0</text>
        <text x="450" y="177" class="node-text">BMI</text>
        <text x="450" y="190" class="node-text" font-size="11">Management</text>

        <!-- 3.0 -->
        <rect x="370" y="255" width="160" height="65" rx="30" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="450" y="277" class="node-text-bold">3.0</text>
        <text x="450" y="292" class="node-text">Search</text>
        <text x="450" y="305" class="node-text" font-size="11">Process</text>

        <!-- 4.0 -->
        <rect x="370" y="370" width="160" height="65" rx="30" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="450" y="392" class="node-text-bold">4.0</text>
        <text x="450" y="407" class="node-text">Settings</text>
        <text x="450" y="420" class="node-text" font-size="11">Process</text>

        <!-- Data Stores -->
        <!-- D1 -->
        <g transform="translate(730, 150)">
          <rect x="0" y="0" width="170" height="60" fill="#FFF" stroke="#000" stroke-width="1.8"/>
          <line x1="40" y1="0" x2="40" y2="60" stroke="#000" stroke-width="1.8"/>
          <text x="20" y="30" class="node-text-bold">D1</text>
          <text x="105" y="22" class="node-text-bold" font-size="11">SharedPreferences</text>
          <text x="105" y="40" class="node-text" font-size="10">(BMI History Data)</text>
        </g>

        <!-- D2 -->
        <g transform="translate(730, 270)">
          <rect x="0" y="0" width="170" height="60" fill="#FFF" stroke="#000" stroke-width="1.8"/>
          <line x1="40" y1="0" x2="40" y2="60" stroke="#000" stroke-width="1.8"/>
          <text x="20" y="30" class="node-text-bold">D2</text>
          <text x="105" y="22" class="node-text-bold" font-size="11">SharedPreferences</text>
          <text x="105" y="40" class="node-text" font-size="10">(Login State)</text>
        </g>

        <!-- Flows for 1.0 -->
        <path d="M 85 190 L 85 45 L 370 45" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="220" y="35" class="label-text">Login Credentials</text>

        <path d="M 370 75 L 110 75 L 110 190" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="220" y="68" class="label-text">Login Status</text>

        <path d="M 530 45 L 810 45 L 810 150" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="650" y="35" class="label-text">Save Login State</text>

        <path d="M 790 270 L 790 85 L 530 85" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="650" y="78" class="label-text">Retrieve Login State</text>

        <!-- Flows for 2.0 -->
        <path d="M 130 205 L 370 155" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="235" y="145" class="label-text">Add / View / Edit /</text>
        <text x="235" y="157" class="label-text">Delete BMI</text>

        <path d="M 370 190 L 130 225" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="235" y="185" class="label-text">BMI List / Details /</text>
        <text x="235" y="197" class="label-text">Operation Status</text>

        <line x1="530" y1="165" x2="730" y2="165" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="630" y="145" class="label-text">Save / Update / Delete</text>
        <text x="630" y="157" class="label-text">BMI Data</text>

        <line x1="730" y1="195" x2="530" y2="195" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="630" y="187" class="label-text">Retrieve BMI Data</text>

        <!-- Flows for 3.0 -->
        <path d="M 130 245 L 370 275" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="235" y="248" class="label-text">Search Query</text>

        <path d="M 370 300 L 130 265" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="235" y="293" class="label-text">Search Results</text>

        <path d="M 530 270 L 730 200" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="640" y="225" class="label-text">Retrieve BMI Data</text>
        <text x="640" y="237" class="label-text">(for Search)</text>

        <path d="M 730 220 L 530 290" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="640" y="275" class="label-text">Matching BMI Data</text>

        <!-- Flows for 4.0 -->
        <path d="M 110 280 L 110 395 L 370 395" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="235" y="385" class="label-text">Request Settings Info</text>

        <path d="M 370 425 L 85 425 L 85 280" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow2)"/>
        <text x="235" y="418" class="label-text">Settings Information</text>
      </svg>
    </div>
  </div>

  <!-- ================= PAGE 3: 1.0 AUTHENTICATION PROCESS ================= -->
  <div class="page">
    <div class="title">1.0 AUTHENTICATION PROCESS</div>
    <div class="svg-container">
      <svg viewBox="0 0 880 460">
        <defs>
          <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000"/>
          </marker>
        </defs>

        <!-- User -->
        <rect x="50" y="50" width="110" height="70" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="105" y="85" class="node-text-bold" font-size="15">User</text>

        <!-- Processes -->
        <!-- 1.1 -->
        <rect x="250" y="50" width="180" height="70" rx="30" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="340" y="77" class="node-text-bold">1.1</text>
        <text x="340" y="93" class="node-text">Validate</text>
        <text x="340" y="106" class="node-text" font-size="11">Credentials</text>

        <!-- 1.2 -->
        <rect x="250" y="190" width="180" height="70" rx="30" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="340" y="217" class="node-text-bold">1.2</text>
        <text x="340" y="233" class="node-text">Check Login</text>
        <text x="340" y="246" class="node-text" font-size="11">State</text>

        <!-- 1.3 -->
        <rect x="250" y="330" width="180" height="70" rx="30" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="340" y="357" class="node-text-bold">1.3</text>
        <text x="340" y="373" class="node-text">Set Login State</text>

        <!-- Data Store D2 -->
        <g transform="translate(620, 270)">
          <rect x="0" y="0" width="220" height="70" fill="#FFF" stroke="#000" stroke-width="1.8"/>
          <line x1="50" y1="0" x2="50" y2="70" stroke="#000" stroke-width="1.8"/>
          <text x="25" y="35" class="node-text-bold" font-size="15">D2</text>
          <text x="135" y="27" class="node-text-bold" font-size="13">SharedPreferences</text>
          <text x="135" y="47" class="node-text" font-size="12">(Login State)</text>
        </g>

        <!-- Flows -->
        <line x1="160" y1="85" x2="250" y2="85" stroke="#000" stroke-width="1.5" marker-end="url(#arrow3)"/>

        <line x1="340" y1="120" x2="340" y2="190" stroke="#000" stroke-width="1.5" marker-end="url(#arrow3)"/>

        <line x1="340" y1="260" x2="340" y2="330" stroke="#000" stroke-width="1.5" marker-end="url(#arrow3)"/>

        <!-- D2 to 1.2 -->
        <path d="M 620 305 L 550 305 L 550 225 L 430 225" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow3)"/>
        <text x="590" y="240" class="label-text">Retrieve</text>
        <text x="590" y="255" class="label-text">Login State</text>

        <!-- 1.3 to D2 -->
        <path d="M 430 365 L 620 365 L 620 340" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow3)"/>
        <text x="520" y="348" class="label-text">Save</text>
        <text x="520" y="360" class="label-text">Login State</text>

        <!-- 1.3 back to User -->
        <path d="M 250 365 L 105 365 L 105 120" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow3)"/>
        <text x="105" y="240" class="label-text">Login</text>
        <text x="105" y="255" class="label-text">Status</text>
      </svg>
    </div>
  </div>

  <!-- ================= PAGE 4: 2.0 BMI MANAGEMENT PROCESS ================= -->
  <div class="page">
    <div class="title">2.0 BMI MANAGEMENT PROCESS</div>
    <div class="svg-container">
      <svg viewBox="0 0 880 460">
        <defs>
          <marker id="arrow4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000"/>
          </marker>
        </defs>

        <!-- Vertical Process Chain -->
        <!-- 2.1 -->
        <rect x="180" y="40" width="220" height="60" rx="25" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="290" y="63" class="node-text-bold">2.1</text>
        <text x="290" y="80" class="node-text">Add BMI</text>

        <!-- 2.2 -->
        <rect x="180" y="140" width="220" height="60" rx="25" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="290" y="163" class="node-text-bold">2.2</text>
        <text x="290" y="180" class="node-text">View BMI</text>

        <!-- 2.3 -->
        <rect x="180" y="240" width="220" height="60" rx="25" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="290" y="263" class="node-text-bold">2.3</text>
        <text x="290" y="280" class="node-text">Edit BMI</text>

        <!-- 2.4 -->
        <rect x="180" y="340" width="220" height="60" rx="25" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="290" y="363" class="node-text-bold">2.4</text>
        <text x="290" y="380" class="node-text">Delete BMI</text>

        <!-- Data Store D1 -->
        <g transform="translate(600, 175)">
          <rect x="0" y="0" width="230" height="110" fill="#FFF" stroke="#000" stroke-width="1.8"/>
          <text x="115" y="35" class="node-text-bold" font-size="16">D1</text>
          <text x="115" y="60" class="node-text-bold" font-size="13">SharedPreferences</text>
          <text x="115" y="80" class="node-text" font-size="12">(BMI Data)</text>
        </g>

        <!-- Flow arrows between processes -->
        <line x1="290" y1="100" x2="290" y2="140" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>
        <line x1="290" y1="200" x2="290" y2="240" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>
        <line x1="290" y1="300" x2="290" y2="340" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>

        <!-- Left vertical bypass bus -->
        <path d="M 180 70 L 110 70 L 110 370 L 180 370" fill="none" stroke="#000" stroke-width="1.5"/>
        <path d="M 110 70 L 180 70" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>
        <path d="M 110 170 L 180 170" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>
        <path d="M 110 270 L 180 270" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>
        <path d="M 110 370 L 180 370" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>

        <!-- Connections to D1 -->
        <!-- 2.1 to D1 -->
        <path d="M 400 70 L 540 70 L 540 200 L 600 200" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>

        <!-- 2.2 to D1 -->
        <path d="M 400 170 L 460 170 L 460 225 L 600 225" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>

        <!-- 2.3 to D1 -->
        <path d="M 400 270 L 460 270 L 460 250 L 600 250" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>

        <!-- 2.4 to D1 -->
        <path d="M 400 370 L 540 370 L 540 275 L 600 275" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>

        <!-- D1 to 2.4 -->
        <path d="M 600 285 L 500 285 L 500 380 L 400 380" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow4)"/>
      </svg>
    </div>
  </div>

  <!-- ================= PAGE 5: 3.0 SEARCH PROCESS ================= -->
  <div class="page">
    <div class="title">3.0 SEARCH PROCESS</div>
    <div class="svg-container">
      <svg viewBox="0 0 880 460">
        <defs>
          <marker id="arrow5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000"/>
          </marker>
        </defs>

        <!-- Vertical Process Chain -->
        <!-- 3.1 -->
        <rect x="200" y="40" width="260" height="60" rx="25" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="330" y="63" class="node-text-bold">3.1</text>
        <text x="330" y="80" class="node-text">Receive Search Query</text>

        <!-- 3.2 -->
        <rect x="200" y="140" width="260" height="60" rx="25" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="330" y="163" class="node-text-bold">3.2</text>
        <text x="330" y="180" class="node-text">Retrieve BMI Data</text>

        <!-- 3.3 -->
        <rect x="200" y="240" width="260" height="60" rx="25" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="330" y="263" class="node-text-bold">3.3</text>
        <text x="330" y="280" class="node-text">Filter Matching BMI Records</text>

        <!-- 3.4 -->
        <rect x="200" y="340" width="260" height="60" rx="25" fill="#FFF" stroke="#000" stroke-width="1.8"/>
        <text x="330" y="363" class="node-text-bold">3.4</text>
        <text x="330" y="380" class="node-text">Display Results</text>

        <!-- Data Store D1 -->
        <g transform="translate(600, 140)">
          <rect x="0" y="0" width="220" height="60" fill="#FFF" stroke="#000" stroke-width="1.8"/>
          <line x1="50" y1="0" x2="50" y2="60" stroke="#000" stroke-width="1.8"/>
          <text x="25" y="30" class="node-text-bold" font-size="15">D1</text>
          <text x="135" y="22" class="node-text-bold" font-size="12">SharedPreferences</text>
          <text x="135" y="42" class="node-text" font-size="11">(BMI Data)</text>
        </g>

        <!-- Process to Process Arrows -->
        <line x1="330" y1="100" x2="330" y2="140" stroke="#000" stroke-width="1.5" marker-end="url(#arrow5)"/>
        <line x1="330" y1="200" x2="330" y2="240" stroke="#000" stroke-width="1.5" marker-end="url(#arrow5)"/>
        <line x1="330" y1="300" x2="330" y2="340" stroke="#000" stroke-width="1.5" marker-end="url(#arrow5)"/>

        <!-- 3.2 <-> D1 -->
        <line x1="460" y1="155" x2="600" y2="155" stroke="#000" stroke-width="1.5" marker-end="url(#arrow5)"/>
        <line x1="600" y1="180" x2="460" y2="180" stroke="#000" stroke-width="1.5" marker-end="url(#arrow5)"/>

        <!-- 3.4 loop back to 3.1 -->
